<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Product Cards</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: white;
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
        }

        .product-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 1200px;
            margin: auto;
        }

        .product-card {
            flex: 1 1 calc(25% - 20px);
            max-width: calc(25% - 20px);
            background-color: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
        }

        .product-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
        }

        .product-card h3 {
            margin: 10px 0 5px;
        }

        .product-card p {
            font-size: 18px;
            color: #e67e22;
            font-weight: bold;
        }

        .product-card button {
            background-color: #2c3e50;
            color: white;
            padding: 8px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 8px;
        }

        /* Tablet */
        @media (max-width: 768px) {
            body {
                background-color: lightblue;
            }
            .product-card {
                flex: 1 1 calc(50% - 20px);
                max-width: calc(50% - 20px);
            }
        }

        /* Mobile */
        @media (max-width: 576px) {
            body {
                background-color: lightgreen;
            }
            .product-card {
                flex: 1 1 100%;
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <h1>Product Cards</h1>
    <div class="product-container">
        <div class="product-card">
            <img src="https://placeholdit.com/150x150/dddddd/999999" alt="Product 1">
            <h3>Product 1</h3>
            <p>₹499</p>
            <button>Buy Now</button>
        </div>
        <div class="product-card">
            <img src="https://placeholdit.com/150x150/dddddd/999999" alt="Product 2">
            <h3>Product 2</h3>
            <p>₹599</p>
            <button>Buy Now</button>
        </div>
        <div class="product-card">
            <img src="https://placeholdit.com/150x150/dddddd/999999" alt="Product 3">
            <h3>Product 3</h3>
            <p>₹699</p>
            <button>Buy Now</button>
        </div>
        <div class="product-card">
            <img src="https://placeholdit.com/150x150/dddddd/999999" alt="Product 4">
            <h3>Product 4</h3>
            <p>₹799</p>
            <button>Buy Now</button>
        </div>
        <div class="product-card">
            <img src="https://placeholdit.com/150x150/dddddd/999999" alt="Product 5">
            <h3>Product 5</h3>
            <p>₹899</p>
            <button>Buy Now</button>
        </div>
        <div class="product-card">
            <img src="https://placeholdit.com/150x150/dddddd/999999" alt="Product 6">
            <h3>Product 6</h3>
            <p>₹999</p>
            <button>Buy Now</button>
        </div>
        <div class="product-card">
            <img src="https://placeholdit.com/150x150/dddddd/999999" alt="Product 7">
            <h3>Product 7</h3>
            <p>₹1099</p>
            <button>Buy Now</button>
        </div>
        <div class="product-card">
            <img src="https://placeholdit.com/150x150/dddddd/999999" alt="Product 8">
            <h3>Product 8</h3>
            <p>₹1199</p>
            <button>Buy Now</button>
        </div>
    </div>
</body>
</html>
