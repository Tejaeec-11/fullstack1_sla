<!DOCTYPE html>
<html>
<head>
    <title>Task 5 - Card with Hide</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Visible Card</h2>
    <div class="card">
        <img src="https://placehold.co/600x400" alt="Card Image">
        <h3>Card Title</h3>
        <p>This card is visible.</p>
    </div>

    <h2>Hidden Card (display: none)</h2>
    <div class="card hidden-card">
        <img src="https://via.placeholder.com/250x150" alt="Card Image">
        <h3>Hidden Card</h3>
        <p>This card is hidden using display: none.</p>
    </div>
</body>
</html>
