<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery Zoom Effect</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f5f5f5;
            padding: 30px;
        }

        h1 {
            color: #333;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 250px);
            gap: 25px;
            justify-content: center;
            margin-top: 40px;
        }

        .image-box {
            width: 250px;
            height: 180px;
            overflow: hidden;
            border-radius: 10px;
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;

            transition: 0.5s;
        }

        .image-box img:hover {
            transform: scale(1.2);
        }
    </style>
</head>

<body>

    <h1>Image Gallery Zoom Effect</h1>

    <div class="gallery">

        <div class="image-box">
            <img src="https://picsum.photos/id/1015/400/300" alt="Image 1">
        </div>

        <div class="image-box">
            <img src="https://picsum.photos/id/1016/400/300" alt="Image 2">
        </div>

        <div class="image-box">
            <img src="https://picsum.photos/id/1025/400/300" alt="Image 3">
        </div>

        <div class="image-box">
            <img src="https://picsum.photos/id/1035/400/300" alt="Image 4">
        </div>

        <div class="image-box">
            <img src="https://picsum.photos/id/1043/400/300" alt="Image 5">
        </div>

        <div class="image-box">
            <img src="https://picsum.photos/id/106/400/300" alt="Image 6">
        </div>

    </div>

</body>
</html>
