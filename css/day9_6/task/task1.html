<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Hover Animation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #f2f2f2;
        }

        h1 {
            color: #333;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
        }

        button {
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            background-color: #3498db;
            color: white;
            font-size: 16px;
            cursor: pointer;

            transition: 0.5s;
        }

        button:hover {
            background-color: #2ecc71;
            color: #000;
            transform: scale(1.1);
        }
    </style>
</head>

<body>

    <h1>Button Hover Animation</h1>

    <div class="buttons">
        <button>Login</button>
        <button>Register</button>
        <button>Submit</button>
        <button>Save</button>
        <button>Delete</button>
    </div>

</body>
</html>
