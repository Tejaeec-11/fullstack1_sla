<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Box Model Demonstration</h1>
    <div class="box-container">
        <div class="box1">Box 1 - No padding, border, margin</div>
        <div class="box2">Box 2 - Padding only</div>
        <div class="box3">Box 3 - Padding + Border</div>
        <div class="box4">Box 4 - Padding + Border + Margin</div>
    </div>
