<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticky Navbar</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
}

.navbar {
    position: sticky;
    top: 0;
    background-color: #2c3e50;
    padding: 15px 30px;
    display: flex;
    gap: 30px;
    z-index: 100;
}

.navbar a {
    color: white;
    text-decoration: none;
    font-size: 18px;
}

section {
    padding: 30px;
}

    </style>
</head>
<body>
    <nav class="navbar">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

    <section>
        <h1>Welcome to Our Company</h1>
        <p style="font-size: 18px; line-height: 2;">Scroll down to see the sticky navbar in action.</p>
        <div style="height: 2000px;"></div>
    </section>
</body>
</html>
