<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification Badge</title>
   <style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.cart-container {
    position: relative;
    display: inline-block;
}

.cart-icon {
    font-size: 30px;
    background: #f0f0f0;
    padding: 20px 30px;
    border-radius: 10px;
    position: relative;
}

.badge {
    position: absolute;
    top: -10px;
    right: -10px;
    background: red;
    color: white;
    font-size: 14px;
    font-weight: bold;
    padding: 5px 10px;
    border-radius: 50px;
}
   </style>
</head>
<body>
    <div class="cart-container">
        <div class="cart-icon">
            🛒 Shopping Cart
            <span class="badge">99+</span>
        </div>
    </div>
</body>
</html>
