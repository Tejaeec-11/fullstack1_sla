<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Chat Button</title>
   
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    padding: 20px;
}

.whatsapp-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background-color: #25D366;
    color: white;
    padding: 12px 20px;
    border-radius: 50px;
    font-size: 18px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

.whatsapp-btn a {
    color: white;
    text-decoration: none;
    font-weight: bold;
}
    </style>
</head>
<body>
    <h1>Customer Support</h1>
    <p style="font-size: 20px; line-height: 2;">Scroll down to see the fixed WhatsApp button.</p>
    <div style="height: 2000px;"></div>

    <div class="whatsapp-btn">
        <a href="#">
            💬 Chat Now
        </a>
    </div>
</body>
</html>
