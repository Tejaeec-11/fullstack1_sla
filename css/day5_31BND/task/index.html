<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Design - Navbar & Cards</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- NAVBAR -->
    <header>
        <nav class="navbar">
         
         <div class="logo">MyBrand</div>
            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- CARDS SECTION -->
    <section class="cards-section">
        <h2>Our Services</h2>
        <div class="card-container">
            <div class="card">
                <img src="https://placeholdit.com/300x180/dddddd/999999" alt="Card Image">
                <h3>Web Development</h3>
                <p>Building responsive and modern websites.</p>
            </div>
            <div class="card">
                <img src="https://placeholdit.com/300x180/dddddd/999999" alt="Card Image">
                <h3>App Development</h3>
                <p>Creating mobile apps for Android and iOS.</p>
            </div>
            <div class="card">
                <img src="https://placeholdit.com/300x180/dddddd/999999" alt="Card Image">
                <h3>UI/UX Design</h3>
                <p>Designing user-friendly and beautiful interfaces.</p>
            </div>
        </div>
    </section>

</body>
</html>
