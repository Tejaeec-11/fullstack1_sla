<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medi -Query</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        a{
            text-decoration: none;
        }
        html{
            scroll-behavior: smooth;
        }
        body{
            font-family: 'Times New Roman', Times, serif;
        }
        
        .box{
            background-color: rgb(8, 157, 75);
            padding: 20px;
           
        }
        @media (max-width:600px){
            
            .box{
            background-color: rgb(147, 9, 126);
            color: rgb(242, 245, 245);
            padding: 10px;
            width: 300px;
            height: 300px;
        }
        }
        
        @media (max-width:300px){
            
            .box{
            background-color: rgb(187, 63, 13);
            color: rgb(247, 186, 203);
            padding: 10px;
            width: 400px;
            height: 400px;
        }
        }
         @media (max-width:150px){
            
            .box{
            background-color: rgb(126, 142, 5);
            color: rgb(247, 186, 203);
            padding: 10px;
            width: 400px;
            height: 400px;
        }
        }
        

    </style>
</head>
<body>
    <div class="box">
        <div>this is meida</div>
    </div>
</body>
</html>
