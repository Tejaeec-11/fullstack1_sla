<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>specificty</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        /*this is element selector 4rd*/
       p{
        background-color: black;
        padding: 20px;

       }
       /*this is class selector 3rd*/
       .para{ 
        background-color: rgb(133, 77, 4);
        padding: 20px;
        color: aliceblue;
       }
       /*this is id selector 2nd */
       #paraid{
        background-color: brown;
        color: coral;
        padding: 20px;
       }
    </style>
</head>
<body>
   <p class="para" id="paraid" style="background-color: darkcyan; color: #000;" >this is test</p> 
   <!--this style is inline where only 1st -->
</body>
</html>
