<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css - pesudo class</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        html{
            scroll-behavior: smooth;
        }
        a{
            text-decoration: none;
        }
        body{
            font-family: 'Times New Roman', Times, serif;
        }
        .box{
            background-color: aquamarine;
            padding: 20px;
            width: 300px;
            height: 300px;
        }
        .box:hover{
            background-color:black;
            color: aliceblue;
            border-radius: 20px;
        }
        
        /*--------------------------------------------------------------*/
        .box1{
            background-color: aquamarine;
            padding: 20px;
            width: 300px;
            height: 300px;
        }
        .box1:active{
            background-color:black;
            color: aliceblue;
            border-radius: 20px;
        }
        /*--------------------------------------------------------------*/
        .box2{
            background-color: aquamarine;
            padding: 20px;
            width: 300px;
            height: 300px;
        }
        .box2:active{
            background-color:black;
            color: aliceblue;
            border-radius: 20px;
            cursor: pointer;
        }
        /*--------------------------------------------------------------*/
        /*--------------------------------------------------------------*/
        .bod1{
            background-color: aquamarine;
            color: black;
            padding: 20px;
           
        }
        .bod1::after{
            content:  "this click new color";
            background-color: brown;
            color: aquamarine;
            padding: 10px;
        }

        /*--------------------------------------------------------------*/
        .bod11{
            background-color: aquamarine;
            color: black;
            padding: 20px;
           
        }
        .bod11::before{
            content:  "this click new color";
            background-color: brown;
            color: aquamarine;
            padding: 10px;
        }
        
        /*--------------------------------------------------------------*/
        .bod111{
            background-color: aquamarine;
            color: black;
            padding: 20px;
           
        }
        .bod111::first-line{
            content:  "this click new color";
            background-color: brown;
            color: aquamarine;
            padding: 10px;
        }
        </style>
</head>
<body>
    <!--this is pesudo class use :hover-->
    <div class="box">
       move pointer touch colour change
    </div> <br><hr><br>
    <!---------------------------------------------------------->
     <div class="box1">
       when you click colur change 
    </div> <br><hr><br>
     <!---------------------------------------------------------->
     <div class="box2">
       when you click pointer change into hand
    </div> <br><hr><br>
     
                     <!--this is pesudo elememtn use :hover-->
    <!---------------------------------------------------------->
     <div class="bod1">
      box
       <p>this is my content </p>
    </div> <br><hr><br>
    <!---------------------------------------------------------->
     <div class="bod11">
      box
       <p>this is my content </p>
    </div> <br><hr><br>
     <!---------------------------------------------------------->
     <div class="bod111">
      box
       <p>this is my content </p>
    </div> <br><hr><br>
</body>
</html>
