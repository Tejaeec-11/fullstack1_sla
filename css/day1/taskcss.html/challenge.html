<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Five Colored Boxes</title>
    <style>
        .box {
            width: 300px;
            height: 100px;
            text-align: center;
            margin: 15px auto;
            padding: 10px;
        }
    </style>
</head>
<body>
    <h1>Five Colored Boxes</h1>

    <div class="box" style="background-color: #ff9999; color: black;">
        <h3>Box 1</h3>
        <p>This is the first box.</p>
    </div>
    <div class="box" style="background-color: #99ccff; color: black;">
        <h3>Box 2</h3>
        <p>This is the second box.</p>
    </div>
    <div class="box" style="background-color: #99ff99; color: black;">
        <h3>Box 3</h3>
        <p>This is the third box.</p>
    </div>
    <div class="box" style="background-color: #ffff99; color: black;">
        <h3>Box 4</h3>
        <p>This is the fourth box.</p>
    </div>
    <div class="box" style="background-color: #ffcc99; color: black;">
        <h3>Box 5</h3>
        <p>This is the fifth box.</p>
    </div>
</body>
</html>
