<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f0f0f0;
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 900px;
            margin: auto;
        }

        .card {
            background-color: #3498db;
            color: white;
            padding: 30px 20px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <h1>Student Dashboard</h1>
    <div class="dashboard">
        <div class="card">Total Students</div>
        <div class="card">Trainers</div>
        <div class="card">Courses</div>
        <div class="card">Placements</div>
        <div class="card">Attendance</div>
        <div class="card">Fees</div>
    </div>
</body>
