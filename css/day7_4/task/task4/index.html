<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Services</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f0f0f0;
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
        }

        .services {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            max-width: 800px;
            margin: auto;
        }

        .service {
            background-color: #2c3e50;
            color: white;
            padding: 40px 20px;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <h1>Our Services</h1>
    <div class="services">
        <div class="service">Web Development</div>
        <div class="service">App Development</div>
        <div class="service">UI/UX Design</div>
        <div class="service">Cloud</div>
        <div class="service">AI</div>
        <div class="service">Digital Marketing</div>
    </div>
</body>
</html>
