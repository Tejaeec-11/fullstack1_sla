<!DOCTYPE html>
<html>
<head>
    <title>Task 3 - Even Numbers</title>
</head>
<body>
<h1>print even number</h1>
<script>
let numbers = [10, 15, 22, 31, 40, 45, 52];

for (let i = 0; i < numbers.length; i++) {
    if (numbers[i] % 2 === 0) {
        document.write(numbers[i] + "<br>");
    }
}
</script>

</body>
</html>
