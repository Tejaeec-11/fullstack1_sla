<!DOCTYPE html>
<html>
<head>
    <title>Task 3 - Array of Objects</title>
</head>
<body>
<h1>array of object</h1>
<script>
let students = [
    {
        name: "Arun",
        mark: 85
    },
    {
        name: "Priya",
        mark: 92
    },
    {
        name: "Kumar",
        mark: 78
    }
];

for (let i = 0; i < students.length; i++) {
    document.write("Name: " + students[i].name + 
                   " - Mark: " + students[i].mark + "<br>");
}
</script>

</body>
</html>
