<!DOCTYPE html>

<head>
    <title>Task 2 - Object Access</title>
</head>
<body>
<h1>object access</h1>
<script>
let student = {
    name: "Arun",
    age: 21,
    course: "JavaScript",
    mark: 85
};

document.write("Name: " + student.name + "<br>");
document.write("Age: " + student.age + "<br>");
document.write("Course: " + student.course + "<br>");
document.write("Mark: " + student.mark + "<br>");
</script>

</body>
</html>
