<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task 2 - Closure Counter</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef4ff;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #ccc;
        }

        h1 {
            color: #0d6efd;
        }

        .output {
            background-color: #e7f1ff;
            padding: 20px;
            border-left: 5px solid #0d6efd;
            margin-top: 20px;
            line-height: 2;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Task 2 - Simple Closure Counter</h1>

    <div class="output" id="output"></div>

</div>

<script>

    function createCounter() {

        let count = 0;

        return function() {

            count++;

            return count;
        };
    }

    const counter = createCounter();

    let output = "";

    output += counter() + "<br>";
    output += counter() + "<br>";
    output += counter();

    document.getElementById("output").innerHTML = output;

</script>

</body>
</html>
