<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task 5 - Manual Push</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eefaf7;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #ccc;
        }

        h1 {
            color: #059669;
        }

        .output {
            background-color: #dff7ed;
            padding: 20px;
            border-left: 5px solid #059669;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Task 5 - Manual Push Without push()</h1>

    <div class="output" id="output"></div>

</div>

<script>

    const numbers = [10, 20, 30];

    let newNumbers = [];

    // Copy values using for loop
    for (let i = 0; i < numbers.length; i++) {

        newNumbers[i] = numbers[i];

    }

    // Add 40 without using push()
    newNumbers[newNumbers.length] = 40;

    document.getElementById("output").innerHTML =
        "Final Array: [" + newNumbers.join(", ") + "]";

</script>

</body>
</html>
