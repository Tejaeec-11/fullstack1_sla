<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 1 - Callback Function</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f1f8f5;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #ccc;
        }

        h1 {
            color: #04aa6d;
        }

        .output {
            background-color: #e7f8ef;
            padding: 15px;
            border-left: 5px solid #04aa6d;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Task 1 - Simple Callback Function</h1>

    <div class="output" id="output"></div>

</div>

<script>

    function processNumber(number, callback) {

        let result = number * 2;

        callback(result);
    }

    processNumber(10, function(result) {

        document.getElementById("output").innerHTML =
            "Result: " + result;

    });

</script>

</body>
</html>
