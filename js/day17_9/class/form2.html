<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>js form handling</title>
</head>
<body>
    <section>
         <div>
            <form>
                <input type="text" id="username" placeholder="Enter the Name">
                <button onclick="handlechange(event)">click to save</button>
            </form>
            <p id="result"></p>
         </div>
  </section>

    <script>
        //add event listener apdi pann avenam but prevent deafaut evemt 
        const handlechange = (event)=>{
            event.preventDefault()//used for not refresh 

        const username = document.getElementById("username").value
        const result = document.getElementById("result")
        //console.log(username)  

        result.textContent = username
    }

     
    </script>
</body>
