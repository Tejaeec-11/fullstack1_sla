<!DOCTYPE html>

<head>
    <title>Task 3 - Arrow Function</title>
</head>
<body>

<h1>Arrow Function</h1>

<script>
let factorial = (number) => {
    let result = 1;

    for (let i = 1; i <= number; i++) {
        result = result * i;
    }

    return result;
};

let answer = factorial(5);

document.write("Factorial: " + answer);
</script>

</body>
</html>
