<!DOCTYPE html>
<html>
<head>
    <title>Task 2 - Function + for Loop</title>
</head>
<body>

<h1>Function + for Loop</h1>

<script>
function printEvenNumbers(n) {
    for (let i = 1; i <= n; i++) {
        if (i % 2 === 0) {
            document.write(i + "<br>");
        }
    }
}

printEvenNumbers(20);
</script>

</body>
</html>
