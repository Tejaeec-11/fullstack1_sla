<!DOCTYPE html>
<html>
<head>
    <title>Task 3 - Mark Grade</title>
</head>
<body>

<script>
    let mark = 85;

    if (mark >= 90 && mark <= 100) {
        console.log("A+");
    } else if (mark >= 75) {
        console.log("A");
    } else if (mark >= 50) {
        console.log("B");
    } else if (mark >= 35) {
        console.log("C");
    } else {
        console.log("Fail");
    }
</script>

</body>
</html>
