<body>
<h1>if else if else</h1>
<script>
    let mark = 75;

    if (mark >= 90) {
        console.log("A+");
    } else if (mark >= 75) {
        console.log("A");
    } else if (mark >= 50) {
        console.log("B");
    } else {
        console.log("Fail");
    }
</script>
