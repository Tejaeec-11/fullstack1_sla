<!DOCTYPE html>
<html>
<head>
    <title>Task 4 - forEach()</title>
</head>
<body>

<h1>Task 4 — forEach()</h1>

<script>

    let students = [
        "Arun",
        "Bala",
        "Kumar",
        "Ravi",
        "Priya"
    ];

    students.forEach(function(student, index) {

        document.write((index + 1) + ". " + student + "<br>");

    });

</script>

</body>
</html>
