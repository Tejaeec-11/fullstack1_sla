<!DOCTYPE html>
<html>
<head>
    <title>Task 2 - pop()</title>
</head>
<body>

<h1>Task 2 — pop()</h1>

<script>

    let fruits = [
        "Apple",
        "Mango",
        "Orange",
        "Banana",
        "Grapes",
        "Watermelon"
    ];

    let removed1 = fruits.pop();
    let removed2 = fruits.pop();

    document.write("Removed Value 1: " + removed1 + "<br>");
    document.write("Removed Value 2: " + removed2 + "<br>");
    document.write("Final Array: [" + fruits.join(", ") + "]");

</script>

</body>
</html>
