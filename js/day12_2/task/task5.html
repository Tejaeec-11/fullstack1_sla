<!DOCTYPE html>
<html>
<head>
    <title>Task 5 - map()</title>
</head>
<body>

<h1>Task 5 — map()</h1>

<script>

    let numbers = [10, 20, 30, 40, 50];

    let doubledNumbers = numbers.map(function(number) {
        return number * 2;
    });

    document.write("Original Array: [" + numbers.join(", ") + "]<br>");
    document.write("Doubled Array: [" + doubledNumbers.join(", ") + "]");

</script>

</body>
</html>
