    <div>
       <form>
        <table cellpadding="5"> <!--cellspace one by one we give-->
            <tr>
                <td><label for="">Enter the name </label></td>
                <td><input type="text" id="inputName" placeholder="Enter the name"></td>

            <tr>

            </tr>
            <tr>
             <td><label for="">Enter the age </label></td>

            </tr>
            <tr>
                <td><input type="submit" id="submit" value="Register"></td>

    <script>
        //1
        const submit = document.getElementById("submit")

        submit.addEventListener("click",(e)=>{//add e becuz to stop reload when submit,e means event

        e.preventDefault()//default prevent pannnu iidu *
        //default when button use inside form it reload default in html to protect it we use prevent default to stop reloD

        const userMobile = document.getElementById("inputMobile").value
        const userAge = document.getElementById("inputAge").value

        //2. local storage - no need refresh,reload,page refresh only i can delete

        console.log(result);
        
        })
