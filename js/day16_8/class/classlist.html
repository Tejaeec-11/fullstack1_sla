<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>class list</title>
    <style>
        .active{
          background-color: aqua;
          color: white ; 
          padding: 20px;
        }

</head>
<body>
    <pre>
        classList.add()
          classList.remove()
            classList.contains()
              classList.toggle()
                classList.replace()
    </pre>
    <div class="box"> <!--class css add panna pora again new name potu 
        mel acss add pannala but this dom method class listt -->
        <h1 class="title">this is text 1</h1>
          <h1 class="title">this is text 1</h1>
            <h1 class="title">this is text 1</h1>
            <button class="btn">click</button>
    </div>
    <script> 
         const box =  document.querySelector(".box")
         const btn = document.querySelector(".btn")

         btn.addEventListener("click",()=>{
            box.classList.add("active") 
         })
    </script>
