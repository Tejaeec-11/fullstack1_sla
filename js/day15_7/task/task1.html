<!DOCTYPE html>
<html>
<head>
    <title>Show Hide Content</title>
    <style>
        #para {
            display: none;
            opacity: 0;
            transition: opacity 0.5s;
        }

        #para.show {
            display: block;
            opacity: 1;
        }
    </style>
</head>
<body>
   
    <p id="para">This is the hidden paragraph.</p>
    <button onclick="togglePara()">Show / Hide</button>

    <script>
        function togglePara() {
            document.getElementById("para").classList.toggle("show");
        }
    </script>

</body>
</html>
