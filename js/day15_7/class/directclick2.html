<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom direct function method</title>
</head>
<body>
    <!--
    1.syntax for button, two method  any method u can use recent method is this 
      btn.addEventListener(" ",()=>{
            
        })this is syntax
    
    -->
    <button id="btn">click adding</button>
    <h1 id="title"></h1>

    <script>
     
        const title = document.getElementById("title")
        const btn =  document.getElementById("btn")
        btn.addEventListener("click",()=>{
          title.textContent = "this is the text"
        })
       
     
    </script>
</body>
</html>
