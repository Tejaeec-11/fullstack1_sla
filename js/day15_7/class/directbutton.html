<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct button call</title>
</head>
<body>
    <!--but put on click so textlistner venam dierct click-->
    <button onclick="createimage()">click Adding</button>
    <h1 id="title"></h1>
    
    <script> 
        const createimage = ()=>{
        const title = document.getElementById("title")
        title.textContent = "this is the text"
        }
    </script>
</body>
</html>
