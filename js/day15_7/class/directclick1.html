<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom direct function method</title>
</head>
<body>
    <!--
    1. event name 
        *onclick
        *onchange
        *submit
    
    
    -->
    <button onclick="createimsge()">click adding</button>
    <h1 id="title"></h1>

    <script>
      const createimsge = ()=>{
        const title = document.getElementById("title")
        title.textContent = "this is the text"
      }  
    </script>
</body>
</html>
