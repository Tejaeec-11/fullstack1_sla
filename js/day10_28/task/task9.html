<!DOCTYPE html>
<html>
<head>
    <title>Task 9 - Array Methods</title>
</head>
<body>

<h1>Task 9 - ES6+ Array Methods</h1>

<script>
    const numbers = [10, 25, 30, 45, 50, 65];

    // Numbers greater than 30
    const greaterThan30 = numbers.filter(number => number > 30);

    // First number greater than 40
    const firstGreaterThan40 = numbers.find(number => number > 40);

    // Check whether 50 exists
    const has50 = numbers.includes(50);

    // Doubled values
    const doubledNumbers = numbers.map(number => number * 2);


    document.write("Numbers greater than 30: " + greaterThan30 + "<br>");
    document.write("First number greater than 40: " + firstGreaterThan40 + "<br>");
    document.write("Does 50 exist: " + has50 + "<br>");
    document.write("Doubled values: " + doubledNumbers);
</script>

</body>
</html>
