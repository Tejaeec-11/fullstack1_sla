<!DOCTYPE html>
<html>
<head>
    <title>Task 3 - Destructuring</title>
</head>
<body>

<h1>Task 3 - Destructuring</h1>

<script>
    const numbers = [10, 20, 30];

    // Array destructuring
    const [first, second, third] = numbers;

    document.write("First: " + first + "<br>");
    document.write("Second: " + second + "<br>");
    document.write("Third: " + third + "<br><br>");


    const student = {
        name: "Ravi",
        age: 25,
        course: "JavaScript"
    };

    // Object destructuring
    const { name, age, course } = student;

    document.write("Name: " + name + "<br>");
    document.write("Age: " + age + "<br>");
    document.write("Course: " + course);
</script>

</body>
</html>
