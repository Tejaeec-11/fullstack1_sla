<!DOCTYPE html>
<html>
<head>
    <title>Task 6 - Student Class</title>
</head>
<body>

<h1>Task 6 - Student Class</h1>

<script>
    class Student {

        constructor(name, age, mark) {
            this.name = name;
            this.age = age;
            this.mark = mark;
        }

        displayDetails() {
            document.write("Name: " + this.name + "<br>");
            document.write("Age: " + this.age + "<br>");
            document.write("Mark: " + this.mark + "<br><br>");
        }
    }

    const student1 = new Student("Ravi", 25, 90);
    const student2 = new Student("Priya", 23, 95);

    student1.displayDetails();
    student2.displayDetails();
</script>

</body>
</html>
