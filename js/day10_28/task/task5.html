<!DOCTYPE html>
<html>
<head>
    <title>Task 5 - Default Parameter</title>
</head>
<body>

<h1>Task 5 - Default Parameter and Template Literal</h1>

<script>
    function studentDetails(name, course, city = "Chennai") {
        return `My name is ${name}. I am studying ${course} in ${city}.`;
    }

    document.write(studentDetails("Ravi", "JavaScript"));
</script>

</body>
</html>
