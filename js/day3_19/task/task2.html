<!DOCTYPE html>

</head>
<body>
<h1>assignment operator</h1>
<script>
    let score = 100;

    score += 10;
    console.log("After += :", score);

    score -= 20;
    console.log("After -= :", score);

    score *= 2;
    console.log("After *= :", score);

    score /= 5;
    console.log("After /= :", score);
</script>

</body>
</html>
