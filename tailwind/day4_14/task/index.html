<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind CSS Tasks</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-8">

    <!-- ============================================ -->
    <!-- TASK 1 — Text                                 -->
    <!-- ============================================ -->
    <h1 class="text-blue-500 font-bold text-center">Task 1: Blue Bold Centered Heading</h1> <br>

    <!-- ============================================ -->
    <!-- TASK 2 — Box                                 -->
    <!-- ============================================ -->
    <div class="p-5 bg-blue-500 rounded-lg text-white">
        Task 2: Box with padding, background, and rounded corners.
    </div><br>

    <!-- ============================================ -->
    <!-- TASK 3 — Button                              -->
    <!-- ============================================ -->
    <button class="bg-blue-500 text-white px-4 py-2 rounded">
        Task 3: Button
    </button><br>

    <!-- ============================================ -->
    <!-- TASK 4 — Two Boxes Side by Side              -->
    <!-- ============================================ -->
    <div class="flex gap-4">
        <div class="p-5 bg-blue-500 rounded-lg text-white w-1/2">Box 1</div>
        <div class="p-5 bg-blue-500 rounded-lg text-white w-1/2">Box 2</div>
    </div><br>

    <!-- ============================================ -->
    <!-- TASK 5 — Simple Hover                        -->
    <!-- ============================================ -->
    <button class="bg-blue-500 hover:bg-blue-700 text-white px-4 py-2 rounded">
        Task 5: Hover Me
    </button><br>

</body>
</html>
