<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Four Columns</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container mt-5">
        <div class="row">
            <div class="col-3 bg-danger text-white p-4">
                <h4>Box 1</h4>
            </div>
            <div class="col-3 bg-warning text-dark p-4">
                <h4>Box 2</h4>
            </div>
            <div class="col-3 bg-info text-white p-4">
                <h4>Box 3</h4>
            </div>
            <div class="col-3 bg-secondary text-white p-4">
                <h4>Box 4</h4>
            </div>
        </div>
    </div>

</body>
</html>
