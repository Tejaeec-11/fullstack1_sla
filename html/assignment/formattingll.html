<!DOCTYPE html>
<html>
<head>
    <title>Formatting </title>
</head>
<body>
    <h1>Five Paragraphs with Formatting</h1>

    <p><b>1.</b> This paragraph has <b>bold text</b>.</p>
    <p><i>2.</i> This paragraph has <i>italic text</i>.</p>
    <p><u>3.</u> This paragraph has <u>underlined text</u>.</p>
    <p><mark>4.</mark> This paragraph has <mark>highlighted text</mark>.</p>
    <p><small>5.</small> This paragraph has <small>small text</small>.</p>
</body>
</html>
