<!DOCTYPE html>
<html>
<head>
    <title>All in One</title>
</head>
<body>
    <h1>Heading 1</h1>
    <p>This is a paragraph.</p>
    <b>Bold Text</b><br>
    <i>Italic Text</i><br>
    <mark>Highlighted Text</mark><br>
    <button>Click Me</button><br><br>
    <input type="text" placeholder="Enter name"><br><br>
    <select>
        <option>Option 1</option>
        <option>Option 2</option>
    </select><br><br>
    <textarea rows="4" cols="30">Type here...</textarea>

    <h2>Explanation</h2>
    <ul>
        <li><b>Heading, Paragraph</b> → Block Level</li>
        <li><b>Bold, Italic, Highlighted</b> → Formatting (also inline)</li>
        <li><b>Button, Input, Select, Textarea</b> → Interactive (also inline/block)</li>
    </ul>
</body>
</html>
