<!DOCTYPE html>
<html>
<head>
    <title>College Admission</title>
</head>
<body>

    <h2>College Admission Form</h2>
    <form method="post">
        <label>Student Name:</label>
        <input type="text" name="studentname"><br><br>

        <label>Father Name:</label>
        <input type="text" name="fathername"><br><br>

        <label>Mother Name:</label>
        <input type="text" name="mothername"><br><br>

        <label>Email:</label>
        <input type="email" name="email"><br><br>

        <label>Phone:</label>
        <input type="tel" name="phone"><br><br>

        <label>DOB:</label>
        <input type="date" name="dob"><br><br>

        <label>Gender:</label>
        <input type="radio" name="gender" value="male"> Male
        <input type="radio" name="gender" value="female"> Female<br><br>

        <label>Department:</label>
        <select name="department">
            <option value="">Select</option>
            <option value="cse">CSE</option>
            <option value="ece">ECE</option>
            <option value="eee">EEE</option>
            <option value="mech">MECH</option>
        </select><br><br>

        <label>Percentage:</label>
        <input type="number" name="percentage"><br><br>

        <label>Address:</label>
        <textarea name="address"></textarea><br><br>

        <label>Passport Size Photo:</label>
        <input type="file" name="photo"><br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </form>

    <hr>

    <h2>Admission Details Table</h2>
    <table border="1">
        <thead>
            <tr>
                <th>Application ID</th>
                <th>Student Name</th>
                <th>Department</th>
                <th>Percentage</th>
                <th>Email</th>
                <th>Admission Status</th>
            </tr>
        </thead>

            </tr>
        </tbody>
    </table>

</body>
</html>
