<!DOCTYPE html>
<html>
<head>
    <title>Employee Registration</title>
</head>
<body>

    <h2>Employee Registration Form</h2>
    <form method="post">
        <label>Employee ID:</label>
        <input type="text" name="empid"><br><br>

        <label>Employee Name:</label>
        <input type="text" name="empname"><br><br>

        <label>Email:</label>
        <input type="email" name="email"><br><br>

        <label>Mobile:</label>
        <input type="tel" name="mobile"><br><br>

        <label>Department:</label>
        <select name="department">
            <option value="">Select</option>
            <option value="it">IT</option>
            <option value="hr">HR</option>
            <option value="finance">Finance</option>
        </select><br><br>

        <label>Experience:</label>
        <input type="number" name="experience"><br><br>

        <label>Salary:</label>
        <input type="number" name="salary"><br><br>

        <label>Skills:</label>
        <input type="checkbox" name="skills" value="html"> HTML
        <input type="checkbox" name="skills" value="css"> CSS
        <input type="checkbox" name="skills" value="js"> JavaScript<br><br>

        <label>Resume Upload:</label>
        <input type="file" name="resume"><br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </form>

    <hr>

    <h2>Employee Report Table</h2>
    <table border="1">
        <thead>
            <tr>
                <th>Employee ID</th>
                <th>Employee Name</th>
                <th>Department</th>
                <th>Experience</th>
                <th>Salary</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>EMP101</td>
                <td>Tejeswari J</td>
                <td>IT</td>
                <td>2 years</td>
                <td>₹45,000</td>
                <td>Active</td>
            </tr>
            <tr>
                <td>EMP102</td>
                <td>Ravi</td>
                <td>HR</td>
                <td>3 years</td>
                <td>₹50,000</td>
                <td>Active</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
