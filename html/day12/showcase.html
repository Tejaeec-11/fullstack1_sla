<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Showcase</title>
</head>
<body> <center>
    <header>
        <h1>Media Showcase</h1>
    </header>

    <main>
        <section>
            <h2>Images</h2>
            <img src="assets/images/bike.jpeg" alt="Image 1" width="200" height="150">
            <img src="assets/images/car.jpeg" alt="Image 2" width="200" height="150">
            <img src="assets/images/phone.jpeg" alt="Image 3" width="200" height="150">
        </section>

        <section>
            <h2>Audio Player</h2>
            <audio controls>
                <source src="assets/audio/audio1.mpeg" type="audio/mpeg">
            </audio>
        </section>

        <section>
            <h2>Video Player</h2>
            <video controls width="500" height="300">
                <source src="assets/video/audio1.mp4" type="video/mp4">
            </video>
        </section>

        <section>
            <h2>YouTube Video</h2>
            <iframe width="560" height="315" src="https://www.youtube.com/embed/tgbNymZ7vqY" frameborder="0" allowfullscreen></iframe>
        </section>

        <section>
            <h2>Google Map</h2>
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3151.835434509837!2d144.9537353153167!3d-37.81627997975159!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6ad65d5df1f6d3b%3A0x5045675218ce6e0!2sMelbourne%20VIC%2C%20Australia!5e0!3m2!1sen!2sin!4v1650000000000" width="600" height="450" style="border:0;" allowfullscreen></iframe>
        </section>

        <section>
            <h2>Embedded PDF</h2>
            <embed src="assets/pdf/2025-11-21 13-47-00.pdf" type="application/pdf" width="600" height="400">
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Media Showcase. All rights reserved.</p>
    </footer></center>
</body>
</html>
